plugins { id 'com.android.application' }

android {
    namespace 'com.nicky7x.riptidemaplab'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nicky7x.riptidemaplab'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.7.0-alpha'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix '.v02' }
        release { minifyEnabled false }
    }
}

dependencies { implementation 'org.tukaani:xz:1.10' }

// Unit tests exercise only synthetic meshes, not commercial game assets.
dependencies { testImplementation 'junit:junit:4.13.2' }