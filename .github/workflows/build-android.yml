name: Build Riptide Map Lab APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
      - 'web/**'
      - 'tests-js/mobile-v07.test.cjs'
      - 'tests-js/texture-v08.test.cjs'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
      - 'web/**'
      - 'tests-js/mobile-v07.test.cjs'
      - 'tests-js/texture-v08.test.cjs'
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate landscape editor bundle
        run: node tests-js/mobile-v07.test.cjs
      - name: Validate material and UV rendering integration
        run: node tests-js/texture-v08.test.cjs
      - name: Compile Android debug APK
        run: gradle -p android --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Publish test APK
        uses: actions/upload-artifact@v4
        with:
          name: riptide-map-lab-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
